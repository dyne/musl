name: musl-dyne
on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing vX.Y.Z tag at this commit to retry publication'
        required: false
        type: string

permissions:
  contents: read

# Never cancel an in-progress publication when master advances.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml ccache pkgconf
      - name: Regression checks
        run: |
          make test
          shellcheck prepare.sh scripts/*.sh

  gcc-musl-build:
    name: Build and validate ${{ matrix.target }}
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            output: x86_64
          - target: arm-linux-musleabihf
            output: arm_hf
          - target: riscv64-linux-musl
            output: riscv_64
          - target: aarch64-linux-musl
            output: arm_64
    env:
      ARCH: ${{ matrix.target }}
      ALPINE_BRANCH: v3.24
      BUILD_FLAVOR: static-small
      # The workspace is mounted at the same path inside and outside Alpine.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      XZ_OPT: -9e -T0
    steps:
      - uses: actions/checkout@v6
      - name: Prepare shared ccache directory
        run: |
          mkdir -p "$CCACHE_DIR"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: v2-${{ runner.os }}-${{ env.ALPINE_BRANCH }}-${{ env.BUILD_FLAVOR }}-${{ matrix.target }}
          max-size: 2G
      - name: Build pinned Alpine chroot
        run: sudo make chroot ALPINE_BRANCH="$ALPINE_BRANCH"
      - name: Verify ccache configuration inside Alpine
        run: |
          # Expand the variables inside Alpine, after its environment is loaded.
          # shellcheck disable=SC2016
          /alpine/enter-chroot sh -eu -c '
            test "$CCACHE_DIR" = "$PWD/.cache/ccache"
            test "$(ccache --get-config compiler_check)" = content
            ccache --show-config
          '
      - name: Fetch verified upstream sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          /alpine/enter-chroot make -C gcc-musl fetch-sources 2>&1 | tee test-results/fetch.log
          /alpine/enter-chroot make -C libs fetch 2>&1 | tee -a test-results/fetch.log
      - name: Build compiler and libraries, prepare package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          /alpine/enter-chroot make prepare BUILD_FLAVOR="$BUILD_FLAVOR" 2>&1 | tee test-results/build.log
      - name: Verify bootstrap C and C++ cache hits
        shell: bash
        run: |
          set -euo pipefail
          /alpine/enter-chroot bash scripts/check-ccache.sh "$ARCH" 2>&1 | tee test-results/ccache-probe.log
      - name: Compile and inspect packaged C/C++ applications
        shell: bash
        run: |
          set -o pipefail
          /alpine/enter-chroot make smoke 2>&1 | tee test-results/smoke.log
      - name: Compress validated package
        env:
          OUTPUT_SUFFIX: ${{ matrix.output }}
        run: |
          tar -cJf "dyne-gcc-musl-${OUTPUT_SUFFIX}.tar.xz" dyne
          python3 scripts/check-archive.py "$ARCH" "dyne-gcc-musl-${OUTPUT_SUFFIX}.tar.xz"
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.output }}
          path: dyne-gcc-musl-${{ matrix.output }}.tar.xz
          if-no-files-found: error
      - name: Report cache statistics and restore runner ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          status=0
          if [[ -x /alpine/enter-chroot ]]; then
            /alpine/enter-chroot ccache --show-stats 2>&1 | tee test-results/ccache.log || status=$?
          fi
          if [[ -d $CCACHE_DIR ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$CCACHE_DIR"
          fi
          exit "$status"
      - name: Retain diagnostic evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs-${{ matrix.output }}
          path: |
            test-results/
            build/libs/**/config.log
            build/libs/**/CMakeConfigureLog.yaml
            gcc-musl/build/**/config.log
          if-no-files-found: warn
          retention-days: 90

  release:
    name: Publish validated artifacts
    needs: [checks, gcc-musl-build]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify complete artifact set and create checksums before tagging
        run: bash scripts/release-checksums.sh release
      - name: Validate explicitly requested retry
        if: github.event_name == 'workflow_dispatch'
        id: retry
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          bash scripts/assert-release-tag.sh "$RELEASE_TAG" "$GITHUB_SHA"
          printf 'tag=%s\npublished=true\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Select version after all builds pass
        if: github.event_name == 'push'
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24.2.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate selected tag and retain release notes
        if: steps.semantic-release.outputs.new_release_published == 'true' || steps.retry.outputs.published == 'true'
        env:
          RELEASE_TAG: ${{ steps.retry.outputs.tag || steps.semantic-release.outputs.new_release_git_tag }}
          RELEASE_NOTES: ${{ steps.semantic-release.outputs.new_release_notes }}
        run: |
          bash scripts/assert-release-tag.sh "$RELEASE_TAG" "$GITHUB_SHA"
          printf '%s\n' "$RELEASE_NOTES" > release-notes.txt
      - name: Stage GitHub release assets for recoverable publication
        if: steps.semantic-release.outputs.new_release_published == 'true' || steps.retry.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.retry.outputs.tag || steps.semantic-release.outputs.new_release_git_tag }}
        run: |
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ $is_draft != true ]]; then
              echo 'Release is already public; refusing to replace published assets' >&2
              exit 1
            fi
          else
            notes=(--generate-notes)
            if grep -q '[^[:space:]]' release-notes.txt; then
              notes=(--notes-file release-notes.txt)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" "${notes[@]}"
          fi
          gh release upload "$RELEASE_TAG" release/*.tar.xz release/SHA256SUMS.txt --clobber
      - name: Upload archives and checksums to file mirror
        if: steps.semantic-release.outputs.new_release_published == 'true' || steps.retry.outputs.published == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.FILES_SSH_HOST }}
          username: ${{ secrets.FILES_SSH_USER }}
          key: ${{ secrets.FILES_SSH_KEY }}
          port: ${{ secrets.FILES_SSH_PORT }}
          source: release/dyne-gcc-musl-x86_64.tar.xz,release/dyne-gcc-musl-arm_hf.tar.xz,release/dyne-gcc-musl-arm_64.tar.xz,release/dyne-gcc-musl-riscv_64.tar.xz,release/SHA256SUMS.txt
          target: /srv/ftp/musl
          strip_components: 1
          overwrite: true
      - name: Publish GitHub release after mirror upload
        if: steps.semantic-release.outputs.new_release_published == 'true' || steps.retry.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.retry.outputs.tag || steps.semantic-release.outputs.new_release_git_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
